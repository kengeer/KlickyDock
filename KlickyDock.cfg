# ============================================================
# KLICKYDOCK SERVO CONTROL
# ============================================================
#
# COMMANDS:
#
#   KLICKYDOCK_DEPLOY
#       Moves KlickyDock to the current Deploy Position.
#       Servo holds after movement until the selected timeout expires.
#
#   KLICKYDOCK_RETRACT
#       Moves KlickyDock to the current Retract Position.
#       Servo holds after movement until the selected timeout expires.
#
#   KLICKYDOCK_ENABLE
#       Enables the servo at the current position.
#       Holds until the selected timeout (default 20 seconds).
#       Set the timeout to 0 to hold indefinitely.
#
#   KLICKYDOCK_DISABLE
#       Disables the servo PWM signal.
#       Servo is disengaged.
#
#   KLICKYMOVED POSITION=xx
#       Changes and tests the Deploy Position.
#       Example:
#           KLICKYMOVED POSITION=8
#
#   KLICKYMOVER POSITION=xx
#       Changes and tests the Retract Position.
#       Example:
#           KLICKYMOVER POSITION=103
#
#   KLICKYDOCK_SAVE
#       Permanently saves BOTH the Deploy and Retract positions.
#
#   KLICKYDOCK_SHOW
#       Displays the current and saved positions.
#
#
# DEFAULT POSITIONS:
#
#   DEPLOY  = 0 degrees
#   RETRACT = 105 degrees
#
#
# STARTUP:
#
#   KlickyDock automatically moves to the saved Retract
#   Position when Klipper starts.
#
#   After movement, the selected timeout starts (0 = hold indefinitely).
#
# ============================================================


# ============================================================
# SAVE VARIABLES
# ============================================================
#
# Klipper requires [save_variables] for KLICKYDOCK_SAVE
# to survive a restart.
#
# IMPORTANT:
# If you already have a [save_variables] section elsewhere,
# DO NOT add another one.
#
# If you do not already have one, uncomment:
#
# [save_variables]
# filename: ~/printer_data/config/saved_variables.cfg
#
# ============================================================


# ------------------------------------------------------------
# SERVO
# ------------------------------------------------------------

[servo klickydock]
pin: PA1
maximum_servo_angle: 180
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.0025


# ------------------------------------------------------------
# CONFIGURATION
# ------------------------------------------------------------

[gcode_macro KLICKYDOCK_CONFIG]

# Default Deploy Position
variable_deploy_position: 0

# Default Retract Position
variable_retract_position: 105

# Time allowed for servo movement in seconds
variable_move_time: 0.6

# Tracks the last commanded servo position
variable_current_position: 105

# Last commanded PWM state (0 = disabled, 1 = enabled)
variable_servo_enabled: 0

# Servo hold timeout in seconds; 0 leaves the servo enabled
variable_enable_timeout: 20

gcode:
    # Configuration storage only


# ============================================================
# DEPLOY KLICKY DOCK
# ============================================================

[gcode_macro KLICKYDOCK_DEPLOY]
description: Deploy KlickyDock
gcode:

    {% set deploy =
        printer["gcode_macro KLICKYDOCK_CONFIG"].deploy_position %}

    {% set move_time =
        printer["gcode_macro KLICKYDOCK_CONFIG"].move_time %}


    SET_GCODE_VARIABLE MACRO=KLICKYDOCK_CONFIG VARIABLE=current_position VALUE={deploy}

    UPDATE_DELAYED_GCODE ID=KLICKYDOCK_AUTO_DISABLE DURATION=0
    SET_SERVO SERVO=klickydock ANGLE={deploy}
    SET_GCODE_VARIABLE MACRO=KLICKYDOCK_CONFIG VARIABLE=servo_enabled VALUE=1

    G4 P{(move_time * 1000)|int}

    _KLICKYDOCK_START_TIMEOUT



# ============================================================
# RETRACT KLICKY DOCK
# ============================================================

[gcode_macro KLICKYDOCK_RETRACT]
description: Retract KlickyDock
gcode:

    {% set retract =
        printer["gcode_macro KLICKYDOCK_CONFIG"].retract_position %}

    {% set move_time =
        printer["gcode_macro KLICKYDOCK_CONFIG"].move_time %}


    SET_GCODE_VARIABLE MACRO=KLICKYDOCK_CONFIG VARIABLE=current_position VALUE={retract}

    UPDATE_DELAYED_GCODE ID=KLICKYDOCK_AUTO_DISABLE DURATION=0
    SET_SERVO SERVO=klickydock ANGLE={retract}
    SET_GCODE_VARIABLE MACRO=KLICKYDOCK_CONFIG VARIABLE=servo_enabled VALUE=1

    G4 P{(move_time * 1000)|int}

    _KLICKYDOCK_START_TIMEOUT



# ============================================================
# DEPLOY POSITION CALIBRATION
# ============================================================
#
# Example:
#
#   KLICKYMOVED POSITION=8
#
# Changes the Deploy Position for the current Klipper session
# and moves the servo to that position.
#
# Run KLICKYDOCK_SAVE when calibration is complete.
#
# ============================================================

[gcode_macro KLICKYMOVED]
description: Test and set KlickyDock Deploy Position
gcode:

    {% set position = params.POSITION|default(-1)|float(-1) %}

    {% set move_time =
        printer["gcode_macro KLICKYDOCK_CONFIG"].move_time %}

    {% if position >= 0 and position <= 180 %}


        SET_GCODE_VARIABLE MACRO=KLICKYDOCK_CONFIG VARIABLE=deploy_position VALUE={position}

        SET_GCODE_VARIABLE MACRO=KLICKYDOCK_CONFIG VARIABLE=current_position VALUE={position}

        UPDATE_DELAYED_GCODE ID=KLICKYDOCK_AUTO_DISABLE DURATION=0
        SET_SERVO SERVO=klickydock ANGLE={position}
        SET_GCODE_VARIABLE MACRO=KLICKYDOCK_CONFIG VARIABLE=servo_enabled VALUE=1

        G4 P{(move_time * 1000)|int}

        _KLICKYDOCK_START_TIMEOUT


    {% else %}

        {action_raise_error(
            "KLICKYMOVED position must be between 0 and 180 degrees"
        )}

    {% endif %}


# ============================================================
# RETRACT POSITION CALIBRATION
# ============================================================
#
# Example:
#
#   KLICKYMOVER POSITION=103
#
# Changes the Retract Position for the current Klipper session
# and moves the servo to that position.
#
# Run KLICKYDOCK_SAVE when calibration is complete.
#
# ============================================================

[gcode_macro KLICKYMOVER]
description: Test and set KlickyDock Retract Position
gcode:

    {% set position = params.POSITION|default(-1)|float(-1) %}

    {% set move_time =
        printer["gcode_macro KLICKYDOCK_CONFIG"].move_time %}

    {% if position >= 0 and position <= 180 %}


        SET_GCODE_VARIABLE MACRO=KLICKYDOCK_CONFIG VARIABLE=retract_position VALUE={position}

        SET_GCODE_VARIABLE MACRO=KLICKYDOCK_CONFIG VARIABLE=current_position VALUE={position}

        UPDATE_DELAYED_GCODE ID=KLICKYDOCK_AUTO_DISABLE DURATION=0
        SET_SERVO SERVO=klickydock ANGLE={position}
        SET_GCODE_VARIABLE MACRO=KLICKYDOCK_CONFIG VARIABLE=servo_enabled VALUE=1

        G4 P{(move_time * 1000)|int}

        _KLICKYDOCK_START_TIMEOUT


    {% else %}

        {action_raise_error(
            "KLICKYMOVER position must be between 0 and 180 degrees"
        )}

    {% endif %}


# ============================================================
# SAVE KLICKYDOCK SETTINGS
# ============================================================
#
# Saves BOTH Deploy and Retract Positions.
#
# ============================================================

[gcode_macro KLICKYDOCK_SAVE]
description: Save KlickyDock Deploy and Retract positions
gcode:

    {% set deploy =
        printer["gcode_macro KLICKYDOCK_CONFIG"].deploy_position %}

    {% set retract =
        printer["gcode_macro KLICKYDOCK_CONFIG"].retract_position %}

    SAVE_VARIABLE VARIABLE=klickydock_deploy_position VALUE={deploy}

    SAVE_VARIABLE VARIABLE=klickydock_retract_position VALUE={retract}

    M118 KlickDock saved: Deploy {deploy} degrees, Retract {retract} degrees


# ============================================================
# ENABLE / LOCK SERVO
# ============================================================

[gcode_macro KLICKYDOCK_ENABLE]
description: Enable KlickyDock servo and hold current position
gcode:

    {% set position =
        printer["gcode_macro KLICKYDOCK_CONFIG"].current_position %}

    UPDATE_DELAYED_GCODE ID=KLICKYDOCK_AUTO_DISABLE DURATION=0
    SET_SERVO SERVO=klickydock ANGLE={position}
    SET_GCODE_VARIABLE MACRO=KLICKYDOCK_CONFIG VARIABLE=servo_enabled VALUE=1

    _KLICKYDOCK_START_TIMEOUT



# ============================================================
# DISABLE / DISENGAGE SERVO
# ============================================================

[gcode_macro KLICKYDOCK_DISABLE]
description: Disable and disengage KlickyDock servo
gcode:

    UPDATE_DELAYED_GCODE ID=KLICKYDOCK_AUTO_DISABLE DURATION=0
    SET_SERVO SERVO=klickydock WIDTH=0
    SET_GCODE_VARIABLE MACRO=KLICKYDOCK_CONFIG VARIABLE=servo_enabled VALUE=0



# ============================================================
# SHOW SETTINGS
# ============================================================

[gcode_macro KLICKYDOCK_SHOW]
description: Show KlickyDock servo settings
gcode:

    {% set config =
        printer["gcode_macro KLICKYDOCK_CONFIG"] %}

    {% set saved =
        printer.save_variables.variables %}

    {% set saved_deploy =
        saved.klickydock_deploy_position|default(0)|float %}

    {% set saved_retract =
        saved.klickydock_retract_position|default(105)|float %}

    {action_respond_info('--------------------------------')}
    {action_respond_info('KlickyDock Settings')}
    {action_respond_info('--------------------------------')}
    {action_respond_info('Current Deploy : ' ~ config.deploy_position ~ ' degrees')}
    {action_respond_info('Current Retract: ' ~ config.retract_position ~ ' degrees')}
    {action_respond_info('Current Servo  : ' ~ config.current_position ~ ' degrees')}
    {action_respond_info('--------------------------------')}
    {action_respond_info('Saved Deploy   : ' ~ saved_deploy ~ ' degrees')}
    {action_respond_info('Saved Retract  : ' ~ saved_retract ~ ' degrees')}
    {action_respond_info('--------------------------------')}


# ============================================================
# STARTUP
# ============================================================
#
# Loads the saved Deploy and Retract positions.
#
# If no saved positions exist:
#
#   Deploy  = 0 degrees
#   Retract = 105 degrees
#
# KlickyDock then moves to the Retract Position.
# The servo holds until the selected timeout expires.
#
# ============================================================

[delayed_gcode KLICKYDOCK_STARTUP]
initial_duration: 1.0
gcode:

    {% set saved = printer.save_variables.variables %}

    {% set deploy =
        saved.klickydock_deploy_position|default(0)|float %}

    {% set retract =
        saved.klickydock_retract_position|default(105)|float %}

    {% set move_time =
        printer["gcode_macro KLICKYDOCK_CONFIG"].move_time %}


    # Restore the saved servo hold timeout (20 seconds on first use).
    SET_GCODE_VARIABLE MACRO=KLICKYDOCK_CONFIG VARIABLE=enable_timeout VALUE={saved.klickydock_enable_timeout|default(20)|float}

    # Load saved Deploy Position

    SET_GCODE_VARIABLE MACRO=KLICKYDOCK_CONFIG VARIABLE=deploy_position VALUE={deploy}


    # Load saved Retract Position

    SET_GCODE_VARIABLE MACRO=KLICKYDOCK_CONFIG VARIABLE=retract_position VALUE={retract}


    # Current position is Retract

    SET_GCODE_VARIABLE MACRO=KLICKYDOCK_CONFIG VARIABLE=current_position VALUE={retract}




    # Move to Retract Position

    UPDATE_DELAYED_GCODE ID=KLICKYDOCK_AUTO_DISABLE DURATION=0
    SET_SERVO SERVO=klickydock ANGLE={retract}
    SET_GCODE_VARIABLE MACRO=KLICKYDOCK_CONFIG VARIABLE=servo_enabled VALUE=1

    G4 P{(move_time * 1000)|int}

    # Start the selected hold timeout after movement

    _KLICKYDOCK_START_TIMEOUT


[save_variables]
filename: ~/printer_data/config/saved_variables.cfg

# Shared timer for deploy, retract, calibration, startup, and manual enable.
[delayed_gcode KLICKYDOCK_AUTO_DISABLE]
gcode:
    KLICKYDOCK_DISABLE

[gcode_macro KLICKYDOCK_SET_TIMEOUT]
description: Set servo hold timeout; 0 disables the timer
gcode:
    {% set seconds = params.SECONDS|default(-1)|float(-1) %}
    {% if seconds >= 0 and seconds < 1.0e100 %}
        SET_GCODE_VARIABLE MACRO=KLICKYDOCK_CONFIG VARIABLE=enable_timeout VALUE={seconds}
        SAVE_VARIABLE VARIABLE=klickydock_enable_timeout VALUE={seconds}
        UPDATE_DELAYED_GCODE ID=KLICKYDOCK_AUTO_DISABLE DURATION=0
        {% if printer["gcode_macro KLICKYDOCK_CONFIG"].servo_enabled|int == 1 and seconds > 0 %}
            UPDATE_DELAYED_GCODE ID=KLICKYDOCK_AUTO_DISABLE DURATION={seconds}
        {% endif %}
    {% else %}
        {action_raise_error("Timeout must be a finite number of seconds, 0 or greater")}
    {% endif %}


# Evaluated when called, so startup uses the restored saved timeout.
[gcode_macro _KLICKYDOCK_START_TIMEOUT]
description: Restart the shared servo hold timer
gcode:
    {% set timeout = printer["gcode_macro KLICKYDOCK_CONFIG"].enable_timeout|float %}
    UPDATE_DELAYED_GCODE ID=KLICKYDOCK_AUTO_DISABLE DURATION=0
    {% if timeout > 0 %}
        UPDATE_DELAYED_GCODE ID=KLICKYDOCK_AUTO_DISABLE DURATION={timeout}
    {% endif %}
